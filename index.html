<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Documentation</title>

    <!-- Google Fonts: Serif for body (Source Serif 4), Sans-serif for UI/Headings (Inter) -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
          rel="stylesheet">

    <!-- KaTeX CSS -->
    <link href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" rel="stylesheet">

    <!-- Highlight.js CSS (GitHub Light Theme) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" rel="stylesheet">

    <!-- Third-party CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --font-serif: 'Source Serif 4', Georgia, Cambria, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;

            --sidebar-width: 280px;
            --bg-color: #ffffff;
            --sidebar-bg: #fafafa;
            --text-main: #242424;
            --text-muted: #6b6b6b;
            --border-color: #e6e6e6;
            --link-color: #1a8917;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-serif);
            font-size: 19px;
            line-height: 1.68;
            -webkit-font-smoothing: antialiased;
        }

        /* Mobile Header */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            padding: 0 1rem;
            z-index: 100;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background-color: var(--text-main);
        }

        .mobile-title {
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 1.05rem;
            margin-left: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-title-link {
            color: inherit;
            text-decoration: none;
        }

        .site-title-link:hover {
            text-decoration: underline;
        }

        /* Layout Containers */
        #app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            padding: 2rem 1.25rem;
            font-family: var(--font-sans);
            z-index: 90;
            transition: transform 0.25s ease;
        }

        .site-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .nav-list {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 0.25rem;
        }

        .nav-item a {
            display: block;
            padding: 0.45rem 0.6rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 400;
            border-radius: 4px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .nav-item a:hover {
            color: var(--text-main);
            background-color: rgba(0, 0, 0, 0.04);
        }

        .nav-item a.active {
            color: var(--text-main);
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.06);
        }

        /* Collapsible Submenus */
        details {
            margin-bottom: 0.25rem;
        }

        summary {
            padding: 0.45rem 0.6rem;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: '›';
            font-size: 1.1rem;
            transition: transform 0.2s ease;
            color: var(--text-muted);
        }

        details[open] > summary::after {
            transform: rotate(90deg);
        }

        details .nav-list {
            padding-left: 0.75rem;
            margin-top: 0.2rem;
            border-left: 1px solid var(--border-color);
            margin-left: 0.6rem;
        }

        /* Main Content Area */
        #main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 4rem 2rem 6rem;
            display: flex;
            justify-content: center;
        }

        #content {
            width: 100%;
            max-width: 1500px;
        }

        /* Index Overview Cards/List Styles */
        .index-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .index-section {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            background: #fafafa;
        }

        .index-section-title {
            font-family: var(--font-sans);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .index-list {
            list-style: none;
            padding-left: 0 !important;
        }

        .index-list li {
            margin-bottom: 0.5rem;
        }

        .index-list li a {
            font-family: var(--font-sans);
            font-weight: 500;
        }

        /* Medium-inspired Typography */
        #content h1,
        #content h2,
        #content h3,
        #content h4 {
            font-family: var(--font-sans);
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }

        #content h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            margin-top: 1.5rem;
        }

        #content h2 {
            font-size: 1.75rem;
            margin-top: 2.75rem;
            margin-bottom: 1rem;
        }

        #content h3 {
            font-size: 1.35rem;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        #content p {
            margin-bottom: 0.5rem;
        }

        #content a {
            color: var(--text-main);
            text-decoration: underline;
            text-decoration-color: rgba(0, 0, 0, 0.3);
            text-underline-offset: 3px;
        }

        #content a:hover {
            text-decoration-color: var(--text-main);
        }

        #content blockquote {
            border-left: 3px solid var(--text-main);
            padding-left: 1.25rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--text-muted);
        }

        #content ul, #content ol {
            padding-left: 1.75rem;
        }

        #content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 3rem 0;
        }

        table {
            border: 3px double black;
            border-collapse: collapse;
        }

        table th,
        table td {
            border: 1px solid black;
            padding: 10px 15px;
        }

        /* Images & Captions */
        #content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 2rem auto 0.5rem;
            border-radius: 4px;
        }

        #content img + em,
        #content figcaption {
            display: block;
            text-align: center;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Code Blocks */
        #content code {
            font-family: var(--font-mono);
            font-size: 0.88em;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 0.15em 0.35em;
            border-radius: 3px;
        }

        #content pre {
            background-color: #f6f8fa;
            padding: 1.25rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 2rem 0;
            border: 1px solid var(--border-color);
        }

        #content pre code {
            background: none;
            padding: 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* Math Formula Block Spacing */
        .katex-display {
            margin: 2rem 0 !important;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.5rem 0;
        }

        /* Mobile Backdrop */
        #backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 80;
        }

        /* Mobile Responsive Breakpoint */
        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }

            #sidebar {
                transform: translateX(-100%);
                top: 56px;
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #backdrop.open {
                display: block;
            }

            #main-content {
                margin-left: 0;
                padding: 5rem 1.25rem 4rem;
            }
        }

        /* Mobile Responsive Breakpoint */
        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }

            #sidebar {
                transform: translateX(-100%);
                top: 56px;
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #backdrop.open {
                display: block;
            }

            #main-content {
                margin-left: 0;
                padding: 5rem 1.25rem 4rem;
                width: 100%;
                overflow-x: hidden;
            }

            #content {
                max-width: 100%;
                overflow-wrap: break-word;
                word-break: break-word;
            }

            #content h1 {
                font-size: 1.8rem;
            }

            #content h2 {
                font-size: 1.4rem;
            }

            #content h3 {
                font-size: 1.2rem;
            }

            table {
                display: block;
                max-width: 100%;
                overflow-x: auto;
                white-space: nowrap;
            }

            #content pre {
                max-width: 100%;
                overflow-x: auto;
                white-space: pre;
            }

            #content code {
                word-break: break-word;
            }
        }
    </style>
</head>
<body>

<header class="mobile-header">
    <button aria-label="Toggle Navigation" class="hamburger-btn" id="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="mobile-title">
        <a class="site-title-link" href="#/" id="mobile-site-title">Documentation</a>
    </div>
</header>

<div id="backdrop"></div>

<div id="app">
    <aside id="sidebar">
        <div class="site-title">
            <a class="site-title-link" href="#/" id="site-title">Documentation</a>
        </div>
        <nav id="nav-tree"></nav>
    </aside>

    <main id="main-content">
        <article id="content">Loading documentation...</article>
    </main>
</div>

<script>
    // 1. Configure Marked with KaTeX Inline/Block Extensions
    const katexExtension = {
        name: 'math',
        level: 'inline',
        start(src) {
            return src.indexOf('$');
        },
        tokenizer(src) {
            // Block math: $$...$$
            const blockMatch = src.match(/^\$\$\n?([\s\S]+?)\n?\$\$/);
            if (blockMatch) {
                return {
                    type: 'math',
                    raw: blockMatch[0],
                    text: blockMatch[1].trim(),
                    display: true
                };
            }
            // Inline math: $...$
            const inlineMatch = src.match(/^\$([^\$\n]+?)\$/);
            if (inlineMatch) {
                return {
                    type: 'math',
                    raw: inlineMatch[0],
                    text: inlineMatch[1].trim(),
                    display: false
                };
            }
        },
        renderer(token) {
            try {
                return katex.renderToString(token.text, {
                    displayMode: token.display,
                    throwOnError: false
                });
            } catch (err) {
                return token.raw;
            }
        }
    };

    marked.use({extensions: [katexExtension]});

    let siteConfig = null;

    // Helper: Resolves a relative path against the current Markdown file's folder directory
    function resolveRelativePath(basePath, relativePath) {
        if (!relativePath || /^(?:[a-z]+:|\/\/|\/)/i.test(relativePath)) {
            return relativePath;
        }

        const dirIndex = basePath.lastIndexOf('/');
        const dir = dirIndex !== -1 ? basePath.substring(0, dirIndex + 1) : '';

        const stack = dir.split('/').filter(Boolean);
        const parts = relativePath.split('/');

        for (const part of parts) {
            if (part === '' || part === '.') continue;
            if (part === '..') {
                if (stack.length > 0) stack.pop();
            } else {
                stack.push(part);
            }
        }

        return stack.join('/');
    }

    // 2. Fetch and Parse `index.yaml`
    async function init() {
        try {
            const response = await fetch('index.yaml');
            if (!response.ok) throw new Error(`Failed to load index.yaml (${response.status})`);
            const yamlText = await response.text();
            siteConfig = jsyaml.load(yamlText);

            if (siteConfig.site_name) {
                document.title = siteConfig.site_name;
                document.getElementById('site-title').textContent = siteConfig.site_name;
                document.getElementById('mobile-site-title').textContent = siteConfig.site_name;
            }

            const navTreeEl = document.getElementById('nav-tree');
            navTreeEl.appendChild(buildNavTree(siteConfig.nav));

            // Handle initial routing
            handleRoute();
        } catch (err) {
            document.getElementById('content').innerHTML = `
          <h1>Configuration Error</h1>
          <p>Could not load or parse <code>index.yaml</code>.</p>
          <pre><code>${err.message}</code></pre>
        `;
        }
    }

    // 3. Build Navigation Tree recursively
    function buildNavTree(navItems) {
        const ul = document.createElement('ul');
        ul.className = 'nav-list';

        navItems.forEach(item => {
            const li = document.createElement('li');
            li.className = 'nav-item';

            if (typeof item === 'string') {
                const a = createNavLink(item, item);
                li.appendChild(a);
            } else if (typeof item === 'object') {
                const title = Object.keys(item)[0];
                const value = item[title];

                if (typeof value === 'string') {
                    const a = createNavLink(title, value);
                    li.appendChild(a);
                } else if (Array.isArray(value)) {
                    const details = document.createElement('details');

                    const summary = document.createElement('summary');
                    summary.textContent = title;
                    details.appendChild(summary);

                    details.appendChild(buildNavTree(value));
                    li.appendChild(details);
                }
            }
            ul.appendChild(li);
        });

        return ul;
    }

    function createNavLink(title, path) {
        const a = document.createElement('a');
        a.textContent = title;
        a.href = `#/${path}`;
        a.dataset.path = path;
        return a;
    }

    // 4. Dynamic Index Generator from YAML Config
    function renderGeneratedIndex() {
        if (!siteConfig || !siteConfig.nav) return;

        const contentEl = document.getElementById('content');
        let html = `<h1>${siteConfig.site_name || 'Documentation'}</h1>`;
        html += `<p style="color: var(--text-muted);">Select a section below or use the sidebar to navigate the documentation.</p>`;
        html += `<div class="index-container">`;

        function renderNavSection(items) {
            let sectionHtml = `<ul class="index-list">`;
            items.forEach(item => {
                if (typeof item === 'string') {
                    sectionHtml += `<li><a href="#/${item}">${item}</a></li>`;
                } else if (typeof item === 'object') {
                    const title = Object.keys(item)[0];
                    const value = item[title];

                    if (typeof value === 'string') {
                        sectionHtml += `<li><a href="#/${value}">${title}</a></li>`;
                    } else if (Array.isArray(value)) {
                        sectionHtml += `
                <li style="margin-top: 1rem;">
                  <div class="index-section">
                    <div class="index-section-title">${title}</div>
                    ${renderNavSection(value)}
                  </div>
                </li>`;
                    }
                }
            });
            sectionHtml += `</ul>`;
            return sectionHtml;
        }

        html += renderNavSection(siteConfig.nav);
        html += `</div>`;

        contentEl.innerHTML = html;

        // Reset active state on nav links
        document.querySelectorAll('#nav-tree a').forEach(a => a.classList.remove('active'));
    }

    // 5. Fetch and Render Markdown Content or Generated Home
async function handleRoute() {
    const rawHash = window.location.hash.replace(/^#\/?/, '');

    // Render home index generated from YAML if path is empty
    if (!rawHash) {
        closeMobileMenu();
        renderGeneratedIndex();
        window.scrollTo(0, 0);
        return;
    }

    // Split route path from anchor link fragment
    const [hashPath, anchorId] = rawHash.split('#');

    // Update active links
    document.querySelectorAll('#nav-tree a').forEach(a => {
        if (a.dataset.path === hashPath) {
            a.classList.add('active');
            let parent = a.closest('details');
            while (parent) {
                parent.open = true;
                parent = parent.parentElement.closest('details');
            }
        } else {
            a.classList.remove('active');
        }
    });

    closeMobileMenu();

    const contentEl = document.getElementById('content');

    // Fetch and render markdown if navigating to a new page
    if (contentEl.dataset.currentPath !== hashPath) {
        try {
            const res = await fetch(hashPath);
            if (!res.ok) throw new Error(`File not found: ${hashPath}`);
            let markdown = await res.text();

            markdown = markdown.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');

            contentEl.innerHTML = marked.parse(markdown, {
                walkTokens(token) {
                    if (token.type === 'image' && token.href) {
                        token.href = resolveRelativePath(hashPath, token.href);
                    }
                    // Rewrite internal anchor links to include current page path
                    if (token.type === 'link' && token.href && token.href.startsWith('#')) {
                        token.href = `#/${hashPath}${token.href}`;
                    }
                }
            });

            // Auto-generate IDs on headings for anchor links
            contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
                heading.id = heading.textContent
                    .toLowerCase()
                    .replace(/[^\w\s-]/g, '')
                    .trim()
                    .replace(/\s+/g, '-');
            });

            // Highlight code blocks
            contentEl.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            contentEl.dataset.currentPath = hashPath;
        } catch (err) {
            document.getElementById('content').innerHTML = `
          <h1>404 - Not Found</h1>
          <p>Unable to load document at <code>${hashPath}</code>.</p>
        `;
            delete contentEl.dataset.currentPath;
            return;
        }
    }

    // Scroll to internal anchor or top of page
    if (anchorId) {
        const targetElement = document.getElementById(anchorId);
        if (targetElement) {
            targetElement.scrollIntoView({ behavior: 'smooth' });
            return;
        }
    }

    window.scrollTo(0, 0);
}

    // 6. Mobile Drawer Interactions
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');

    function openMobileMenu() {
        sidebar.classList.add('open');
        backdrop.classList.add('open');
    }

    function closeMobileMenu() {
        sidebar.classList.remove('open');
        backdrop.classList.remove('open');
    }

    menuToggle.addEventListener('click', () => {
        sidebar.classList.contains('open') ? closeMobileMenu() : openMobileMenu();
    });

    backdrop.addEventListener('click', closeMobileMenu);
    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
