<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Flashcards</title>

    <!-- Google Fonts for Themes -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400;600;700&family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Nunito:wght@400;600;700&family=Open+Sans:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Share+Tech+Mono&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

    <!-- KaTeX CSS -->
    <link href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" rel="stylesheet">

    <!-- Highlight.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" rel="stylesheet" id="hljs-theme">

    <!-- Third-party CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const validThemes = ['medium', 'whimsical', 'diary', 'techno', 'greenery', 'school', 'spring'];
        let currentTheme = urlParams.get('theme');
        if (!validThemes.includes(currentTheme)) currentTheme = 'medium';
        document.documentElement.classList.add(`theme-${currentTheme}`);

        if (currentTheme === 'techno') {
            document.getElementById('hljs-theme').href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css";
        }
    </script>

    <style>
        :root, .theme-medium {
            --font-serif: 'Source Serif 4', Georgia, Cambria, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            --sidebar-width: 280px;
            --bg-color: #ffffff;
            --sidebar-bg: #fafafa;
            --text-main: #242424;
            --text-muted: #6b6b6b;
            --border-color: #e6e6e6;
            --link-color: #242424;
            --code-bg: #f6f8fa;
            --bg-image: none;
        }

        .theme-whimsical {
            --font-serif: 'Nunito', sans-serif;
            --font-sans: 'Nunito', sans-serif;
            --font-mono: ui-monospace, monospace;
            --bg-color: #fffaf0;
            --sidebar-bg: #ffe4e1;
            --text-main: #4a0e4e;
            --text-muted: #d05b82;
            --border-color: #ffb6c1;
            --link-color: #ff1493;
            --code-bg: #fff0f5;
        }

        .theme-diary {
            --font-serif: 'Caveat', cursive, serif;
            --font-sans: 'Caveat', cursive, sans-serif;
            --font-mono: ui-monospace, monospace;
            --bg-color: #fdf5e6;
            --sidebar-bg: #faebd7;
            --text-main: #00008b;
            --text-muted: #4682b4;
            --border-color: #87ceeb;
            --link-color: #8b0000;
            --code-bg: #f0f8ff;
            --bg-image: repeating-linear-gradient(transparent, transparent 31px, var(--border-color) 31px, var(--border-color) 32px);
        }

        .theme-techno {
            --font-serif: 'Share Tech Mono', monospace;
            --font-sans: 'Share Tech Mono', monospace;
            --font-mono: 'Share Tech Mono', monospace;
            --bg-color: #050505;
            --sidebar-bg: #0f0f0f;
            --text-main: #00ff41;
            --text-muted: #008f11;
            --border-color: #008f11;
            --link-color: #ff00ff;
            --code-bg: #111111;
        }

        .theme-greenery {
            --font-serif: 'Lora', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: ui-monospace, monospace;
            --bg-color: #f4f7f3;
            --sidebar-bg: #e2ebd9;
            --text-main: #1b3b22;
            --text-muted: #4d6a52;
            --border-color: #c1d3be;
            --link-color: #2d7a42;
            --code-bg: #e8f0e6;
        }

        .theme-school {
            --font-serif: 'Architects Daughter', cursive;
            --font-sans: 'Fredoka', cursive, sans-serif;
            --font-mono: ui-monospace, monospace;
            --bg-color: #e0f7fa;
            --sidebar-bg: #fffde7;
            --text-main: #2c3e50;
            --text-muted: #5c6bc0;
            --border-color: #ff8a65;
            --link-color: #d81b60;
            --code-bg: #ffffff;
        }

        .theme-spring {
            --font-serif: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-sans: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;
            --bg-color: #ffffff;
            --sidebar-bg: #f8f9fa;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --link-color: #5fb832;
            --code-bg: #f8f9fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-attachment: local;
            color: var(--text-main);
            font-family: var(--font-serif);
            font-size: 19px;
            line-height: 1.68;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-header {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            padding: 0 1rem;
            z-index: 100;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background-color: var(--text-main);
        }

        .mobile-title {
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 1.05rem;
            margin-left: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #app { display: flex; min-height: 100vh; }

        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0; bottom: 0; left: 0;
            overflow-y: auto;
            padding: 2rem 1.25rem;
            font-family: var(--font-sans);
            z-index: 90;
            transition: transform 0.25s ease;
        }

        .site-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .site-title a { color: inherit; text-decoration: none; }

        .nav-list { list-style: none; }
        .nav-item { margin-bottom: 0.25rem; }
        .nav-item a {
            display: block;
            padding: 0.45rem 0.6rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.92rem;
            border-radius: 4px;
            transition: background 0.15s, color 0.15s;
        }
        .nav-item a:hover { color: var(--text-main); background-color: rgba(128, 128, 128, 0.15); }
        .nav-item a.active { color: var(--text-main); font-weight: 600; background-color: rgba(128, 128, 128, 0.2); }

        details summary {
            padding: 0.45rem 0.6rem;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        details summary::-webkit-details-marker { display: none; }
        details summary::after { content: '›'; transition: transform 0.2s; color: var(--text-muted); }
        details[open] > summary::after { transform: rotate(90deg); }
        details .nav-list { padding-left: 0.75rem; border-left: 1px solid var(--border-color); margin-left: 0.6rem; }

        #main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 4rem 2rem 6rem;
            display: flex;
            justify-content: center;
        }

        #content { width: 100%; max-width: 1500px; }

        /* --- TWO-HALF FLASHCARD STYLES --- */
        .flashcard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            user-select: none;
        }

        .flashcard {
            width: 100%;
            min-height: 450px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            margin-bottom: 2rem;
            transition: opacity 0.2s ease;
            overflow: hidden;
        }

        .flashcard-half {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            user-select: text;
        }

        .flashcard-front {
            background-color: rgba(0, 0, 0, 0.02);
            font-weight: 600;
        }

        .flashcard-back {
            background-color: transparent;
        }

        .flashcard-divider {
            width: 100%;
            border-top: 2px dashed var(--border-color);
            position: relative;
        }

        .flashcard-divider::after {
            content: 'BACK';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-color);
            padding: 0 12px;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        .flashcard-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .flashcard-btn {
            background: var(--sidebar-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .flashcard-btn:hover { background: var(--border-color); }

        #card-counter {
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 80px;
            text-align: center;
        }

        .flashcard-half h1, .flashcard-half h2, .flashcard-half h3 { font-family: var(--font-sans); color: var(--text-main); margin-bottom: 1rem; }
        .flashcard-half p { margin-bottom: 0.5rem; }
        .flashcard-half a { color: var(--link-color); text-decoration: underline; }
        .flashcard-half ul, .flashcard-half ol { padding-left: 1.75rem; text-align: left; width: 100%; margin-bottom: 0.5rem; }
        .flashcard-half pre { background-color: var(--code-bg); padding: 1rem; border-radius: 6px; overflow-x: auto; width: 100%; text-align: left; }
        .flashcard-half code { font-family: var(--font-mono); background-color: var(--code-bg); padding: 0.2em 0.4em; border-radius: 3px; }

        #backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 80; }

        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            #sidebar { transform: translateX(-100%); top: 56px; }
            #sidebar.open { transform: translateX(0); }
            #backdrop.open { display: block; }
            #main-content { margin-left: 0; padding: 5rem 1.25rem 4rem; width: 100%; }
            .flashcard { min-height: 400px; }
            .flashcard-half { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>

<header class="mobile-header">
    <button aria-label="Toggle Navigation" class="hamburger-btn" id="menu-toggle">
        <span></span><span></span><span></span>
    </button>
    <div class="mobile-title">
        <a href="#/" id="mobile-site-title">Flashcards</a>
    </div>
</header>

<div id="backdrop"></div>

<div id="app">
    <aside id="sidebar">
        <div class="site-title">
            <a href="#/" id="site-title">Flashcards</a>
        </div>
        <nav id="nav-tree"></nav>
    </aside>

    <main id="main-content">
        <article id="content">Loading content...</article>
    </main>
</div>

<script>
    const katexExtension = {
        name: 'math',
        level: 'inline',
        start(src) { return src.indexOf('$'); },
        tokenizer(src) {
            const blockMatch = src.match(/^\$\$\n?([\s\S]+?)\n?\$\$/);
            if (blockMatch) return { type: 'math', raw: blockMatch[0], text: blockMatch[1].trim(), display: true };
            const inlineMatch = src.match(/^\$([^\$\n]+?)\$/);
            if (inlineMatch) return { type: 'math', raw: inlineMatch[0], text: inlineMatch[1].trim(), display: false };
        },
        renderer(token) {
            try { return katex.renderToString(token.text, { displayMode: token.display, throwOnError: false }); }
            catch (err) { return token.raw; }
        }
    };

    marked.use({extensions: [katexExtension]});

    let siteConfig = null;
    let flashcards = [];
    let currentCardIndex = 0;
    let currentHashPath = '';

    let touchstartX = 0;
    let touchendX = 0;

    function resolveRelativePath(basePath, relativePath) {
        if (!relativePath || /^(?:[a-z]+:|\/\/|\/)/i.test(relativePath)) return relativePath;
        const dirIndex = basePath.lastIndexOf('/');
        const dir = dirIndex !== -1 ? basePath.substring(0, dirIndex + 1) : '';
        const stack = dir.split('/').filter(Boolean);
        const parts = relativePath.split('/');
        for (const part of parts) {
            if (part === '' || part === '.') continue;
            if (part === '..') { if (stack.length > 0) stack.pop(); }
            else stack.push(part);
        }
        return stack.join('/');
    }

    async function init() {
        try {
            const response = await fetch('index.yaml');
            if (!response.ok) throw new Error(`Failed to load index.yaml (${response.status})`);
            const yamlText = await response.text();
            siteConfig = jsyaml.load(yamlText);

            if (siteConfig.site_name) {
                document.title = siteConfig.site_name;
                document.getElementById('site-title').textContent = siteConfig.site_name;
                document.getElementById('mobile-site-title').textContent = siteConfig.site_name;
            }

            document.getElementById('nav-tree').appendChild(buildNavTree(siteConfig.nav));
            handleRoute();
        } catch (err) {
            document.getElementById('content').innerHTML = `<h1>Configuration Error</h1><pre><code>${err.message}</code></pre>`;
        }
    }

    function buildNavTree(navData) {
        const ul = document.createElement('ul');
        ul.className = 'nav-list';
        if (!navData) return ul;

        function processNode(title, value) {
            const li = document.createElement('li');
            li.className = 'nav-item';
            if (typeof value === 'string') {
                const a = document.createElement('a');
                a.textContent = title;
                a.href = `${window.location.search}#/${value}`;
                a.dataset.path = value;
                li.appendChild(a);
            } else if (typeof value === 'object' && value !== null) {
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                summary.textContent = title;
                details.appendChild(summary);
                details.appendChild(buildNavTree(value));
                li.appendChild(details);
            }
            return li;
        }

        if (Array.isArray(navData)) {
            navData.forEach(item => {
                if (typeof item === 'string') ul.appendChild(processNode(item, item));
                else if (typeof item === 'object' && item !== null) Object.entries(item).forEach(([k, v]) => ul.appendChild(processNode(k, v)));
            });
        } else if (typeof navData === 'object' && navData !== null) {
            Object.entries(navData).forEach(([k, v]) => ul.appendChild(processNode(k, v)));
        }
        return ul;
    }

    function parseFrontBack(mdText) {
        const backMatch = mdText.match(/^(?:Back:|\*\*Back:\*\*)\s*/im);
        if (backMatch) {
            const splitIdx = backMatch.index;
            let frontRaw = mdText.substring(0, splitIdx).replace(/^(?:Front:|\*\*Front:\*\*)\s*/i, '').trim();
            let backRaw = mdText.substring(splitIdx + backMatch[0].length).trim();
            return { front: frontRaw, back: backRaw };
        }
        return { front: mdText.replace(/^(?:Front:|\*\*Front:\*\*)\s*/i, '').trim(), back: '' };
    }

    function renderCurrentCard() {
        if (!flashcards.length) return;

        currentCardIndex = (currentCardIndex + flashcards.length) % flashcards.length;

        const rawMd = flashcards[currentCardIndex];
        const { front, back } = parseFrontBack(rawMd);
        const currentSearch = window.location.search;

        const parseOptions = {
            walkTokens(token) {
                if (token.type === 'image' && token.href) token.href = resolveRelativePath(currentHashPath, token.href);
                if (token.type === 'link' && token.href) {
                    if (token.href.startsWith('#')) token.href = `${currentSearch}#/${currentHashPath}${token.href}`;
                    else if (!/^(?:[a-z]+:|\/\/|\/)/i.test(token.href)) token.href = `${currentSearch}#/${resolveRelativePath(currentHashPath, token.href)}`;
                }
            }
        };

        const frontHtml = marked.parse(front, parseOptions);
        const backHtml = back ? marked.parse(back, parseOptions) : '';

        const flashcardBody = document.getElementById('flashcard-body');
        if (flashcardBody) {
            flashcardBody.style.opacity = 0;
            setTimeout(() => {
                flashcardBody.innerHTML = `
                    <div class="flashcard-half flashcard-front">${frontHtml}</div>
                    ${back ? `<div class="flashcard-divider"></div><div class="flashcard-half flashcard-back">${backHtml}</div>` : ''}
                `;
                flashcardBody.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${flashcards.length}`;
                flashcardBody.style.opacity = 1;
            }, 100);
        }
    }

    window.nextCard = function() { currentCardIndex++; renderCurrentCard(); };
    window.prevCard = function() { currentCardIndex--; renderCurrentCard(); };
    window.randomCard = function() {
        if (flashcards.length <= 1) return;
        let newIndex;
        do { newIndex = Math.floor(Math.random() * flashcards.length); } while (newIndex === currentCardIndex);
        currentCardIndex = newIndex;
        renderCurrentCard();
    };

    function handleSwipeGesture() {
        const threshold = 50;
        if (touchendX < touchstartX - threshold) nextCard();
        if (touchendX > touchstartX + threshold) prevCard();
    }

    window.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
    window.addEventListener('touchend', e => {
        touchendX = e.changedTouches[0].screenX;
        if(document.getElementById('flashcard-body')) handleSwipeGesture();
    }, {passive: true});

    window.addEventListener('keydown', e => {
        if(!document.getElementById('flashcard-body')) return;
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === 'ArrowLeft') prevCard();
    });

    async function handleRoute() {
        const rawHash = window.location.hash.replace(/^#\/?/, '');
        closeMobileMenu();

        if (!rawHash) {
            document.getElementById('content').innerHTML = `<h1>Welcome</h1><p>Select a deck from the sidebar.</p>`;
            return;
        }

        const [hashPath] = rawHash.split('#');
        currentHashPath = hashPath;

        document.querySelectorAll('#nav-tree a').forEach(a => {
            if (a.dataset.path === hashPath) {
                a.classList.add('active');
                let parent = a.closest('details');
                while (parent) { parent.open = true; parent = parent.parentElement.closest('details'); }
            } else a.classList.remove('active');
        });

        const contentEl = document.getElementById('content');
        if (contentEl.dataset.currentPath !== hashPath) {
            try {
                const res = await fetch(hashPath);
                if (!res.ok) throw new Error(`File not found: ${hashPath}`);
                let markdown = await res.text();

                flashcards = markdown
                    .split(/^(?:---)$/m)
                    .map(card => card.trim())
                    .filter(card => card.length > 0);

                if (flashcards.length === 0) {
                    contentEl.innerHTML = `<p>No valid flashcard content found in this file.</p>`;
                    return;
                }

                currentCardIndex = 0;
                contentEl.dataset.currentPath = hashPath;

                contentEl.innerHTML = `
                    <div class="flashcard-container" id="flashcard-container">
                        <div id="flashcard-body" class="flashcard"></div>
                        <div class="flashcard-controls">
                            <button class="flashcard-btn" onclick="prevCard()">&#8592; Prev</button>
                            <span id="card-counter"></span>
                            <button class="flashcard-btn" onclick="nextCard()">Next &#8594;</button>
                            <button class="flashcard-btn" onclick="randomCard()">Random</button>
                        </div>
                    </div>
                `;

                renderCurrentCard();
            } catch (err) {
                contentEl.innerHTML = `<h1>404 - Not Found</h1><p>Unable to load document at <code>${hashPath}</code>.</p>`;
                delete contentEl.dataset.currentPath;
            }
        }
        window.scrollTo(0, 0);
    }

    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');

    function openMobileMenu() { sidebar.classList.add('open'); backdrop.classList.add('open'); }
    function closeMobileMenu() { sidebar.classList.remove('open'); backdrop.classList.remove('open'); }

    menuToggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeMobileMenu() : openMobileMenu());
    backdrop.addEventListener('click', closeMobileMenu);

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
